<!-- html-logo.svg
     A small vector icon used as the site logo in the header. SVG (Scalable
     Vector Graphics) is an XML-based image format that stays perfectly
     sharp at any size, which is why it's a good fit for a logo. -->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- <defs> defines reusable resources (here: a gradient) that don't
       render by themselves but can be referenced by other shapes below. -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- Two color stops create the purple-to-blue gradient used
           everywhere else on the site (buttons, headings, icons). -->
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f8dff" />
    </linearGradient>
  </defs>

  <!-- A rounded square "badge" background, filled with the gradient
       defined above via fill="url(#logoGradient)". -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#logoGradient)" />

  <!-- The "</>" code symbol, drawn as simple line paths in white so it
       stands out against the gradient background. -->
  <path d="M12 10 L7 16 L12 22" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M20 10 L25 16 L20 22" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="18" y1="8" x2="14" y2="24" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" />
</svg>
